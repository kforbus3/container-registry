name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # The race detector is worth the extra minutes here: the registry runs
      # SBOM generation, vulnerability scanning, webhook delivery and garbage
      # collection on background workers, and a data race between them is
      # exactly the kind of bug that never shows up locally.
      - name: Test
        # The api package alone takes several minutes under -race; the default
        # per-package timeout is 10 minutes and a loaded runner can get close.
        run: go test -race -count=1 -timeout 20m ./...

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t container-registry:ci .

      # A registry that cannot start is not a working image, and the compose
      # file runs it with no capabilities and a read-only root filesystem — a
      # combination worth proving rather than assuming.
      - name: Start it the way compose does
        run: |
          docker run -d --name ci-registry \
            --security-opt no-new-privileges:true --cap-drop ALL --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            -e REGISTRY_ADMIN_PASSWORD=ci-test-password \
            -p 5000:5000 container-registry:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/healthz >/dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "the registry never became healthy"
          docker logs ci-registry
          exit 1

      - name: Push and pull a blob
        run: |
          set -euo pipefail
          auth='admin:ci-test-password'
          location=$(curl -sS -u "$auth" -X POST -D- -o /dev/null \
            http://127.0.0.1:5000/v2/ci/app/blobs/uploads/ \
            | grep -i '^location:' | tr -d '\r' | awk '{print $2}')
          digest="sha256:$(printf 'ci' | sha256sum | awk '{print $1}')"
          curl -sS -u "$auth" -X PUT --data-binary 'ci' \
            -H 'Content-Type: application/octet-stream' \
            "http://127.0.0.1:5000${location}?digest=${digest}" -o /dev/null
          curl -sSf -u "$auth" "http://127.0.0.1:5000/v2/ci/app/blobs/${digest}" -o /dev/null
          echo "blob round-tripped"

      - name: Logs on failure
        if: failure()
        run: docker logs ci-registry
